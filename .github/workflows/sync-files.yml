name: Sync Files

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: 55 15 * * *

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: 准备完成
      uses: actions/checkout@v4

    - name: 下载架构编译配置文件
      run: |
        mkdir -p ./armv8
        wget --no-check-certificate --no-cache -O ./armv8/feeds.conf https://fw0.koolcenter.com/iStoreOS/easepi-r1/feeds.conf
        wget --no-check-certificate --no-cache -O ./armv8/.config https://fw0.koolcenter.com/iStoreOS/easepi-r1/config.buildinfo

        FILE_PATH="./armv8/.config"
        if [ -f "$FILE_PATH" ] && [ -s "$FILE_PATH" ]; then
           content=$(cat ${GITHUB_WORKSPACE}/configfiles/config_data-6.x.txt)
           configdata=$(echo "$content" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
           echo -e "\\n$configdata" >> ./armv8/.config
           # 对CONFIG_开头的行按key去重，保留最后一个（后面的覆盖前面的）
           grep '^CONFIG_' ./armv8/.config | awk -F= '{key=$1; data[key]=$0} END {for (k in data) print data[k]}' | sort > ./armv8/.config.new
           grep -v '^CONFIG_' ./armv8/.config > ./armv8/.config.head
           cat ./armv8/.config.head ./armv8/.config.new > ./armv8/.config
           rm -f ./armv8/.config.head ./armv8/.config.new
        else
           echo "不处理数据。"
        fi

    - name: 同步配置
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: main
        publish_dir: ./
        user_name: 'GitHub Action'
        user_email: 'github-actions[bot]@github.com'
        exclude_assets: ''
        keep_files: true
        commit_message: "Sync files"
